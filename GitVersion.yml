assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch
assembly-informational-format: '{InformationalVersion}'
increment: Inherit
tag-prefix: '[vV]'
mode: ContinuousDelivery
strategies:
    - ConfiguredNextVersion
    - Mainline
# Conventional Commits. The legacy `breaking:` and `feature:` prefixes stay
# matched because no release is tagged, so GitVersion recomputes the version
# from all history; dropping them would lower the computed version.
major-version-bump-message: '(?m)^(breaking:|[a-z]+(\([^)]*\))?!:|BREAKING[ -]CHANGE:)'
minor-version-bump-message: '^(feat|feature)(\([^)]*\))?:'
patch-version-bump-message: '^(fix|perf)(\([^)]*\))?:'
no-bump-message: 'skip:.*'

branches:
    main:
        increment: Patch
        mode: ContinuousDeployment
        regex: ^(origin/)?main$
        is-main-branch: true
    develop:
        increment: Minor
        label: beta
        regex: (origin/)?dev(elop)?(ment)?$
